<!doctype html>
<html><head><meta charset="utf-8"><title>steps</title>
<style>html,body{margin:0;background:#cfe6f7;overflow:hidden}canvas{display:block}</style>

</head><body>
<script type="module">
import * as THREE from 'three';
import { LDrawLoader } from 'three/addons/loaders/LDrawLoader.js';
import { LDrawConditionalLineMaterial } from 'three/addons/materials/LDrawConditionalLineMaterial.js';

const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1000, H = +q.get('h') || 750;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.shadowMap.enabled = false;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(q.get('bg') || '#cfe6f7');
scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa3ad, 2.4));
const sun = new THREE.DirectionalLight(0xffffff, 1.8); scene.add(sun);

const loader = new LDrawLoader();
loader.setConditionalLineMaterial(LDrawConditionalLineMaterial);
loader.setPartsLibraryPath('/tools/ldraw/');
await loader.preloadMaterials('/tools/ldraw/LDConfig.ldr');
loader.smoothNormals = true;
const text = await (await fetch(q.get('model'))).text();
const group = await new Promise((res, rej) => loader.parse(text, res, rej));
group.rotation.x = Math.PI;
scene.add(group);
group.updateMatrixWorld(true);

// parts = direct children with a building step
const parts = group.children.filter(c => c.userData.buildingStep !== undefined);
const faded = new Map(), hot = new Map();
function fadeMat(m) {
  if (!faded.has(m)) {
    const f = m.clone();
    if (f.color && f.color.lerp) f.color.copy(m.color).lerp(new THREE.Color('#ffffff'), m.type.includes('Line') ? 0.55 : 0.28);
    if (f.opacity !== undefined && !m.isLineBasicMaterial) { f.transparent = m.transparent; }
    faded.set(m, f);
  }
  return faded.get(m);
}
function hotLine(m) {
  if (!hot.has(m)) { const f = m.clone(); if (f.color && f.color.set) f.color.set('#f2b705'); hot.set(m, f); }
  return hot.get(m);
}
for (const p of parts) p.traverse(o => { if (o.material) o.userData.orig = o.material; });

const box = new THREE.Box3().setFromObject(group), c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3());
const R = sz.length() / 2;
const az = THREE.MathUtils.degToRad(+(q.get('az') ?? 45)), el = THREE.MathUtils.degToRad(+(q.get('el') ?? 35.264));
const dir = new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
const zoom = +(q.get('zoom') ?? 1);
const s = R / zoom * 0.98, a = W / H;
const cam = new THREE.OrthographicCamera(-s * a, s * a, s, -s, -R * 20, R * 20);
cam.position.copy(c).addScaledVector(dir, R * 4); cam.lookAt(c);
sun.position.copy(c).add(new THREE.Vector3(R, R * 2.5, R * 1.5)); sun.target.position.copy(c); scene.add(sun.target);

window.nSteps = Math.max(...parts.map(p => p.userData.buildingStep)) + 1;
window.setStep = (k, fadeBefore = true, hotOn = true) => {
  for (const p of parts) {
    const st = p.userData.buildingStep;
    p.visible = st <= k;
    p.traverse(o => {
      if (!o.userData.orig) return;
      const isLine = o.isLineSegments;
      if (st === k) o.material = isLine && hotOn && q.get('hot') !== '0' ? hotLine(o.userData.orig) : o.userData.orig;
      else o.material = fadeBefore ? fadeMat(o.userData.orig) : o.userData.orig;
    });
  }
  renderer.render(scene, cam);
  return true;
};
window.READY = { nSteps: window.nSteps };
</script></body></html>
